name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # ailog owns spec/canonical-vectors.json; canonical tests skip (loudly)
      # without it, so check it out as a sibling to actually verify conformance.
      - uses: actions/checkout@v4
        with:
          repository: Mby159/ailog
          path: ailog

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
